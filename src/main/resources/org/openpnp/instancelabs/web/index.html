<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Paste dispenser</title>
<link rel="icon" id="favicon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/run.css">
<link rel="stylesheet" href="/static/board.css">
<link rel="stylesheet" href="/static/boardimport.css">
<link rel="stylesheet" href="/static/padprofile.css">
<link rel="stylesheet" href="/static/setup.css">
<link rel="stylesheet" href="/static/profile.css">
<!-- core.js runs at once (sets the theme before the first paint, defines IL); the workspace modules
     register with IL.workspace() in order; app.js (last) boots. See DEV_NOTES.md. -->
<script src="/static/core.js"></script>
<script src="/static/boardart.js" defer></script>
<script src="/static/boardview.js" defer></script>
<script src="/static/pathpreview.js" defer></script>
<script src="/static/padinspect.js" defer></script>
<script src="/static/boardflow.js" defer></script>
<script src="/static/boardimport.js" defer></script>
<script src="/static/padprofile.js" defer></script>
<script src="/static/run.js" defer></script>
<script src="/static/setup.js" defer></script>
<script src="/static/profile.js" defer></script>
<script src="/static/calibrate.js" defer></script>
<script src="/static/records.js" defer></script>
<script src="/static/app.js" defer></script>
</head>
<body>
<svg class="sprite" width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
<symbol id="g-check" viewBox="0 0 24 24"><path d="M6 12.5l4 4 8-9"/></symbol>

<symbol id="g-dash" viewBox="0 0 24 24"><path d="M7.5 12h9"/></symbol>
<symbol id="g-info" viewBox="0 0 24 24"><path d="M12 11v6.5M12 6.8v.2"/></symbol>
<symbol id="i-run" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M10 8.6l5.4 3.4-5.4 3.4z"/></symbol>
<symbol id="i-setup" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></symbol>
<symbol id="i-profile" viewBox="0 0 24 24"><path d="M12 3.5c3.6 4.5 6 7.8 6 10.8a6 6 0 0 1-12 0c0-3 2.4-6.3 6-10.8z"/><path d="M9.5 14.5a2.5 2.5 0 0 0 2.5 2.5"/></symbol>
<symbol id="i-cal" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5"/><path d="M12 2.5v4M12 17.5v4M2.5 12h4M17.5 12h4"/><circle cx="12" cy="12" r="1.4"/></symbol>
<symbol id="i-records" viewBox="0 0 24 24"><path d="M4 6h12M4 11h7M4 16h5"/><circle cx="16.5" cy="15.5" r="4.5"/><path d="M16.5 13.2v2.5l1.6 1.2"/></symbol>
<symbol id="i-gauge" viewBox="0 0 24 24"><path d="M4.2 16.5a8.2 8.2 0 1 1 15.6 0"/><path d="M12 14.2l4.2-4.6"/><circle cx="12" cy="14.5" r="1.3"/></symbol>
<symbol id="i-chev" viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></symbol>
<symbol id="i-minus" viewBox="0 0 24 24"><path d="M6 12h12"/></symbol>
<symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8h3l1.6-2.2h6.8L17 8h3v10.5H4z"/><circle cx="12" cy="13" r="3.2"/></symbol>
<symbol id="i-refresh" viewBox="0 0 24 24"><path d="M19 12a7 7 0 1 1-2.1-5"/><path d="M19 4.5V8h-3.5"/></symbol>
<symbol id="i-swap" viewBox="0 0 24 24"><path d="M5 9h13l-3.5-3.5M19 15H6l3.5 3.5"/></symbol>
<symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5l11 6.5-11 6.5z"/></symbol>
<symbol id="i-capture" viewBox="0 0 24 24"><path d="M12 4v10M8 10l4 4 4-4M5 19h14"/></symbol>
<symbol id="i-mark" viewBox="0 0 24 24"><path d="M12 3v8M8.5 11h7l-1.6 4.2h-3.8z"/><circle cx="12" cy="19.5" r="1.4"/></symbol>
<symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
<symbol id="i-plug" viewBox="0 0 24 24"><path d="M9 3v5M15 3v5M6.5 8h11v3a5.5 5.5 0 0 1-11 0zM12 16.5V21"/></symbol>
<symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11l8-6.5 8 6.5M6.5 9.5V19h11V9.5"/></symbol>
<symbol id="i-wipe" viewBox="0 0 24 24"><path d="M4 18h16M7 14l4.5-9 6.5 3.2-4.5 9"/></symbol>
<symbol id="i-hand" viewBox="0 0 24 24"><path d="M8 12V6.5a1.5 1.5 0 0 1 3 0V11M11 10V5a1.5 1.5 0 0 1 3 0v5M14 10V6.5a1.5 1.5 0 0 1 3 0V14a6 6 0 0 1-6 6h-.5a6 6 0 0 1-4.6-2.2L4 15.2a1.5 1.5 0 0 1 2.3-1.9L8 15"/></symbol>
<symbol id="i-paste" viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="13" rx="2"/><path d="M12 16v3M10 21h4"/></symbol>
<symbol id="i-back" viewBox="0 0 24 24"><path d="M14.5 6l-6 6 6 6"/></symbol>
<symbol id="i-needle" viewBox="0 0 24 24"><path d="M12 3v12M9 6h6M12 15l-1.2 4h2.4z"/></symbol>
<symbol id="i-close" viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></symbol>
<symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></symbol>
<symbol id="i-moon" viewBox="0 0 24 24"><path d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10z"/></symbol>
<symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7.5 3v5.5c0 4.6-3.2 8.2-7.5 9.5-4.3-1.3-7.5-4.9-7.5-9.5V6z"/><path d="M9 12l2.2 2.2L15.5 10"/></symbol>
<symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6.5h11M9 12h11M9 17.5h11"/><circle cx="4.8" cy="6.5" r="1.1"/><circle cx="4.8" cy="12" r="1.1"/><circle cx="4.8" cy="17.5" r="1.1"/></symbol>
<symbol id="i-angle" viewBox="0 0 24 24"><path d="M4 19h16M4 19L16 6"/><path d="M10.5 19a6.5 6.5 0 0 0-2-4.7"/></symbol>
<symbol id="i-purge" viewBox="0 0 24 24"><rect x="3" y="9" width="4" height="6" rx="1"/><rect x="10" y="9" width="4" height="6" rx="1"/><rect x="17" y="9" width="4" height="6" rx="1"/></symbol>
<symbol id="i-keyboard" viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M6 10h.1M9.5 10h.1M13 10h.1M16.5 10h1.5M6 14h12"/></symbol>
</svg>

<div class="app" id="app">
  <header class="strip" id="strip">
    <!-- STOP is first in the DOM (first Tab stop); CSS order puts it at the right edge. -->
    <div class="stop-bay">
      <button type="button" id="btn-stop" class="stop" data-testid="stop" aria-keyshortcuts="F9"
              title="Stops everything now. Sends M410, M107 P3, M107 P2, M107 P1, M107 P0, M18 B (quick stop, dispenser valve and pump off, pick valve and pump off, screw motor off), vents a pressure hold, then stops OpenPnP (the machine must be connected and homed again). Key: F9."><span class="stop__word">STOP</span><span class="stop__sub"><kbd>F9</kbd> motion · vent · screw off</span></button>
    </div>
    <a class="skip" href="#main" id="skip-main">Skip to main</a>
    <button type="button" class="brand" id="brand" data-open-view="activity" title="Activity: what OpenPnP and this page did">
      <span class="brand__mark"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-mark"/></svg><span class="sim-tag" id="sim-tag" hidden title="Simulator: OpenPnP runs the simulated machine">Sim</span></span>
      <span class="brand__text"><span class="brand__name">Paste dispenser</span><span class="brand__live" id="heartbeat"><span class="live-dot"></span><span class="hb__who">OpenPnP</span> <b class="hb__age">…</b><span class="hb__ago"> ago</span></span></span>
      <span class="brand__short" id="heartbeat-short"><span class="live-dot"></span><b class="hb__age">…</b></span>
    </button>
    <div class="cells" id="cells" aria-live="polite">
      <button type="button" class="cell cell--off" id="cell-machine" data-open-view="machine"><span class="st st--sm st--off" role="img" aria-label="Off or not fitted"><svg viewBox="0 0 24 24"><use href="#g-dash"/></svg></span><span class="cell__txt"><span class="cell__k">Machine</span><span class="cell__v"><span id="pill-conn" data-l="1">Connecting…</span><span class="cell__sep" hidden> · </span><span id="pill-homed" class="sr">…</span></span></span></button>
      <button type="button" class="cell-act" id="btn-start" hidden title="Connect to the controller (OpenPnP's Start button). Nothing moves.">Connect</button>
      <button type="button" class="cell-act" id="btn-home" hidden title="Move every axis to its home switch so positions are known (press twice)">Home</button>
      <button type="button" class="cell cell--off" id="pill-pressure" data-open-view="pressure"><span class="st st--sm st--off" role="img" aria-label="Off or not fitted"><svg viewBox="0 0 24 24"><use href="#g-dash"/></svg></span><span class="cell__txt"><span class="cell__k">Pressure</span><span class="cell__v">…</span></span></button>
      <button type="button" class="cell cell--off" id="chip-angle" data-open-view="angle"><span class="st st--sm st--off" role="img" aria-label="Off or not fitted"><svg viewBox="0 0 24 24"><use href="#g-dash"/></svg></span><span class="cell__txt"><span class="cell__k">Start angle</span><span class="cell__v">…</span></span></button>
      <button type="button" class="cell cell--off" id="chip-purge" data-open-view="purge"><span class="st st--sm st--off" role="img" aria-label="Off or not fitted"><svg viewBox="0 0 24 24"><use href="#g-dash"/></svg></span><span class="cell__txt"><span class="cell__k">Purge row</span><span class="cell__v">…</span></span></button>
      <button type="button" class="cell cell--off cell--verdict" id="pill-engine"><span class="st st--sm st--off" role="img" aria-label="Off or not fitted"><svg viewBox="0 0 24 24"><use href="#g-dash"/></svg></span><span class="cell__txt"><span class="cell__k">Board run</span><span class="cell__v">…</span></span><svg class="chev ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-chev"/></svg></button>
    </div>
  </header>
  <!-- STOP NOT CONFIRMED / confirmed after n tries: its own grid row directly under the strip (pushes the page down) -->
  <div class="stop-band" id="stop-unconfirmed" role="alert" hidden></div>

  <nav class="nav tabs" id="nav" role="tablist" aria-label="Workspaces">
    <a class="nav__item" href="#run" id="tab-btn-run" data-tab="run" role="tab" aria-selected="true" aria-controls="ws-run" aria-keyshortcuts="Alt+1"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-run"/></svg><span class="nav__txt"><span class="nav__t">Run</span><span class="nav__s"></span></span><span class="nav__badge" hidden></span></a>
    <a class="nav__item" href="#setup" id="tab-btn-setup" data-tab="setup" role="tab" aria-selected="false" aria-controls="ws-setup" aria-keyshortcuts="Alt+2"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-setup"/></svg><span class="nav__txt"><span class="nav__t">Setup</span><span class="nav__s"></span></span><span class="nav__badge" hidden></span></a>
    <a class="nav__item" href="#profile" id="tab-btn-profile" data-tab="profile" role="tab" aria-selected="false" aria-controls="ws-profile" aria-keyshortcuts="Alt+3"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-profile"/></svg><span class="nav__txt"><span class="nav__t">Profile</span><span class="nav__s"></span></span><span class="nav__badge" hidden></span></a>
    <a class="nav__item" href="#calibrate" id="tab-btn-calibrate" data-tab="calibrate" role="tab" aria-selected="false" aria-controls="ws-calibrate" aria-keyshortcuts="Alt+4"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-cal"/></svg><span class="nav__txt"><span class="nav__t">Calibrate</span><span class="nav__s"></span></span><span class="nav__badge" hidden></span></a>
    <a class="nav__item" href="#records" id="tab-btn-records" data-tab="records" role="tab" aria-selected="false" aria-controls="ws-records" aria-keyshortcuts="Alt+5"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-records"/></svg><span class="nav__txt"><span class="nav__t">Records</span><span class="nav__s"></span></span><span class="nav__badge" hidden></span></a>
    <div class="nav__foot">
      <div class="seg seg--block" role="group" aria-label="Theme">
        <button type="button" data-theme-set="light" aria-pressed="true">Light</button>
        <button type="button" data-theme-set="dark" aria-pressed="false">Dark</button>
      </div>
      <div class="nav__keys">
        <kbd>F9</kbd><span>STOP</span>
        <span><kbd>Alt</kbd></span><span><kbd>1</kbd>–<kbd>5</kbd> workspaces</span>
        <kbd>Esc</kbd><span>closes a dialog</span>
      </div>
    </div>
    <button type="button" class="nav__theme" id="btn-theme" data-theme-toggle title="Switch between light and dark" aria-label="Switch between light and dark"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-moon"/></svg></button>
  </nav>

  <main class="main" id="main" tabindex="-1">
    <!-- offline, vent_failed and other page-level bands (IL.msg) -->
    <div class="msg-area" id="msg-area"></div>
    <!-- workspaces: empty here, filled by run.js, setup.js, profile.js, calibrate.js, records.js -->
    <section class="ws" data-workspace="run" id="ws-run" role="tabpanel" aria-labelledby="tab-btn-run"></section>
    <section class="ws" data-workspace="setup" id="ws-setup" role="tabpanel" aria-labelledby="tab-btn-setup" hidden></section>
    <section class="ws" data-workspace="profile" id="ws-profile" role="tabpanel" aria-labelledby="tab-btn-profile" hidden></section>
    <section class="ws" data-workspace="calibrate" id="ws-calibrate" role="tabpanel" aria-labelledby="tab-btn-calibrate" hidden></section>
    <section class="ws" data-workspace="records" id="ws-records" role="tabpanel" aria-labelledby="tab-btn-records" hidden></section>
  </main>

  <aside class="panel" id="panel" data-view="" aria-label="Context panel">
    <div class="panel__bar" id="panel-bar" hidden>
      <button type="button" class="btn btn--quiet btn--sm" id="panel-back" title="Back (Esc)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-back"/></svg>Back</button>
      <h2 class="panel__bar-t" id="panel-bar-title"></h2>
    </div>
    <div class="panel__top" id="panel-top" hidden></div>
    <div class="panel__scroll" id="panel-scroll">
      <div class="panel__stop" id="panel-stop" hidden>
        <button type="button" class="stop stop--panel" data-stop-copy aria-keyshortcuts="F9"
                title="Stops everything now. Sends M410, M107 P3, M107 P2, M107 P1, M107 P0, M18 B (quick stop, dispenser valve and pump off, pick valve and pump off, screw motor off), vents a pressure hold, then stops OpenPnP (the machine must be connected and homed again). Key: F9."><span class="stop__word">STOP</span><span class="stop__sub"><kbd>F9</kbd> motion · vent · screw off</span></button>
      </div>
      <div class="panel__body" id="panel-body"></div>
    </div>
    <div class="panel__foot" id="panel-foot" hidden></div>
  </aside>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
